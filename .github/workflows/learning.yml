name: Learning

on:
  workflow_dispatch:

  schedule:
    # Sonuç/öğrenme kontrolünü maçların bitmesinin muhtemel olduğu
    # saatlere indiriyoruz. GitHub Actions cron saatleri UTC'dir.
    #
    # Cuma
    - cron: "30 20 * * 5"

    # Cumartesi
    - cron: "30 20 * * 6"

    # Pazar
    - cron: "30 20 * * 0"

    # Pazartesi
    - cron: "30 20 * * 1"

permissions:
  contents: write

concurrency:
  group: super-lig-learning
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -q

      - name: Update results and learning state
        run: |
          python main.py learn

      - name: Persist learning state
        run: |
          git config user.name "superlig-al[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No learning state changes to commit."
          else
            git commit -m "chore: update learning state"
            git push
          fi

name: Super Lig Prediction

on:
  workflow_dispatch:

  schedule:
    # Süper Lig maçlarının bulunduğu günlerde temel kontrol.
    # Ağır analiz yalnızca Python tarafında T-60 penceresinde başlar.
    #
    # GitHub Actions cron UTC kullanır.
    #
    # Cuma
    - cron: "*/5 15-20 * * 5"

    # Cumartesi
    - cron: "*/5 10-20 * * 6"

    # Pazar
    - cron: "*/5 10-20 * * 0"

    # Pazartesi
    - cron: "*/5 15-20 * * 1"

permissions:
  contents: write

concurrency:
  group: super-lig-prediction
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -q

      - name: Build prediction state
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py predict

      - name: Persist prediction state before Telegram
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No prediction state changes to commit."
          else
            git commit -m "chore: reserve prediction delivery"
            git push
          fi

      - name: Deliver Telegram predictions
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py deliver

      - name: Persist Telegram delivery result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No delivery state changes to commit."
          else
            git commit -m "chore: persist prediction delivery"
            git push
          fi

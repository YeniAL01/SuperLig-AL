name: Prediction

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: superlig-state
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Build and reserve predictions
        run: python main.py predict

      - name: Persist reservation before Telegram
        run: |
          git config user.name "superlig-al[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data

          if git diff --cached --quiet; then
            echo "No prediction state changes to commit."
          else
            git commit -m "chore: reserve prediction delivery"
            git push
          fi

      - name: Deliver reserved predictions
        id: deliver
        continue-on-error: true
        run: python main.py deliver
        env:
          TELEGRAM_PREDICTION_BOT_TOKEN: ${{ secrets.TELEGRAM_PREDICTION_BOT_TOKEN }}
          TELEGRAM_PREDICTION_CHAT_ID: ${{ secrets.TELEGRAM_PREDICTION_CHAT_ID }}

      - name: Persist delivery result
        if: always()
        run: |
          git config user.name "superlig-al[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data

          if git diff --cached --quiet; then
            echo "No delivery state changes to commit."
          else
            git commit -m "chore: update Telegram delivery state"
            git push
          fi

      - name: Fail workflow when Telegram delivery failed
        if: steps.deliver.outcome == 'failure'
        run: exit 1

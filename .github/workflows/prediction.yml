name: Prediction
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: superlig-state
  cancel-in-progress: false
jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt

      - name: Build and reserve predictions
        run: python main.py predict

      - name: Persist reservation before Telegram
        run: |
          git config user.name "superlig-al[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "chore: reserve prediction delivery"
          git push

      - name: Deliver reserved predictions
        id: deliver
        continue-on-error: true
        run: python main.py deliver
        env:
          TELEGRAM_PREDICTION_BOT_TOKEN: ${{ secrets.TELEGRAM_PREDICTION_BOT_TOKEN }}
          TELEGRAM_PREDICTION_CHAT_ID: ${{ secrets.TELEGRAM_PREDICTION_CHAT_ID }}

      - name: Persist delivery result
        if: always()
        run: |
          git add data
          git diff --cached --quiet || git commit -m "chore: update Telegram delivery state"
          git push

      - name: Fail workflow when Telegram delivery failed
        if: steps.deliver.outcome == 'failure'
        run: exit 1

name: Prediction

on:
  schedule:
    # GitHub cron is UTC. The service first reads the live FotMob fixture list
    # and performs no pre-match work unless a fixture is inside T-60.
    #
    # Normal Süper Lig window (Fri-Mon): 12:00-22:59 Türkiye.
    - cron: "*/10 9-19 * * 5,6,0,1"
    # Midweek safety window (Tue-Thu): 17:00-22:59 Türkiye.
    - cron: "*/10 14-19 * * 2-4"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "İlk 4 gelecek maçı Telegram görseli olarak test et (hafızaya yazmaz)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: superlig-state
  cancel-in-progress: false

jobs:
  predict:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build and reserve predictions
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_mode) }}
        run: python main.py predict

      - name: Send prediction visual test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode }}
        run: python main.py test-prediction
        env:
          TELEGRAM_PREDICTION_BOT_TOKEN: ${{ secrets.TELEGRAM_PREDICTION_BOT_TOKEN }}
          TELEGRAM_PREDICTION_CHAT_ID: ${{ secrets.TELEGRAM_PREDICTION_CHAT_ID }}

      - name: Persist reservation before Telegram
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_mode) }}
        run: |
          git config user.name "superlig-al[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No prediction state changes to commit."
          else
            git commit -m "chore: reserve prediction delivery"
            git push
          fi

      - name: Deliver reserved predictions
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_mode) }}
        id: deliver
        continue-on-error: true
        run: python main.py deliver
        env:
          TELEGRAM_PREDICTION_BOT_TOKEN: ${{ secrets.TELEGRAM_PREDICTION_BOT_TOKEN }}
          TELEGRAM_PREDICTION_CHAT_ID: ${{ secrets.TELEGRAM_PREDICTION_CHAT_ID }}

      - name: Persist delivery result
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_mode) }}
        run: |
          git config user.name "superlig-al[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No delivery state changes to commit."
          else
            git commit -m "chore: update Telegram delivery state"
            git push
          fi

      - name: Fail workflow when Telegram delivery failed
        if: ${{ steps.deliver.outcome == 'failure' && !(github.event_name == 'workflow_dispatch' && inputs.test_mode) }}
        run: exit 1

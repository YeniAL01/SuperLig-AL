name: Weekly Report

on:
  schedule:
    # Saatlik kontrol. report.py yalnızca son maçtan en az 1 saat sonra ve
    # aynı hafta için daha önce rapor gönderilmediyse iki görseli yollar.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force_resend:
        description: "Daha önce gönderilmiş haftalık raporu test için tekrar gönder"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: superlig-state
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Generate and send weekly report
        env:
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
          FORCE_RESEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force_resend || false }}
        run: python report.py
      - name: Upload weekly report artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: reports
      - name: Persist report state
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.force_resend) }}
        run: |
          git config user.name "superlig-al[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No report state changes to commit."
          else
            git commit -m "chore: update report state"
            git push
          fi

name: Weekly Report

on:
  schedule:
    # Pazartesi maçlarının tamamlanmasından sonra.
    # GitHub Actions cron UTC kullanır.
    # 22:00 UTC = Türkiye saatiyle 01:00 Salı.
    - cron: "0 22 * * 1"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: superlig-state
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Generate and send weekly report
        env:
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
        run: python report.py

      - name: Upload weekly report artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: reports

      - name: Persist report state
        run: |
          git config user.name "superlig-al[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data

          if git diff --cached --quiet; then
            echo "No report state changes to commit."
          else
            git commit -m "chore: update report state"
            git push
          fi
